<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EB Academy | Login</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css?v=6">
</head>

<body>

    <div class="login-container">
        <img src="../assets/logo.png" alt="EB Academy Logo" style="width: 280px; height: auto; margin-top: -60px; margin-bottom: -30px; margin-left: auto; margin-right: auto; display: block;">

        <p class="subtitle">School fee and attendance management system</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Username </label>
                <input type="text" id="email" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="footer-links" style="text-align: center;">
            <a href="mailto:admin@ebacademy.edu?subject=Login Support Request" style="display:inline-block; margin-top:10px;">Forgot Password or Need Help? Contact Administration</a>
        </div>
    </div>

    <script src="login.js?v=2"></script>
</body>

</html>
