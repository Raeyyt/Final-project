# PostgreSQL only — runs in its own container (separate from the FastAPI process).
#
# Start from repo root:
#   docker compose up -d
#
# The API defaults to this instance (see backend/app/config.py and backend/env.example).
# Run uvicorn from the backend/ folder; no SQLite is required.

services:
  db:
    image: postgres:16-alpine
    container_name: school_mgmt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
